language: zh-TW
protection:
  explosions:
    # cancel-whole：波及需防護的領地時取消整次爆炸；disabled：不由 Land 攔截爆炸。
    # 範圍無法核實時取消整次爆炸，包含沒有 force 的區塊來源爆炸。
    # 這可能取消領地外的床／重生錨爆炸；若要完全停用 Land 爆炸攔截，設定 mode: disabled。
    # 正式保護仍受 ownership.active 與程式待命閘門控制。
    mode: cancel-whole
    # 自然爆炸及無法確認玩家來源的 TNT，共用環境防護。
    environment-protection: true
    attribution-max-depth: 32
ownership:
  # 尚未完成交接前保持 false；不會因為安裝插件就接手 zero。
  active: false
storage:
  backend: SQLITE
  schema-version: 1
  directory: storage

display:
  player-land-topbar: true
  public-land-topbar: false
