language: zh-TW
protection:
  liquids:
    # 阻止水／岩漿跨入、跨出或跨越不同命中領地；同一組領地內流動保留。
    prevent-boundary-flow: true
  growth:
    # 樹木／方塊擴散不得跨越領地命中邊界；領地內的自然生長保留。
    prevent-boundary-crossing: true
  entities:
    # 阻止生物在任何命中領地內踩踏耕地或觸發方塊互動。
    block-mob-interactions: true
    # 無法確認玩家來源的生物／環境傷害，在領地內採保護優先。
    prevent-unattributed-damage: true
  lightning:
    # 阻止領地內的雷擊、雷擊點火、雷擊傷害及可識別的生物轉化。
    protect-claims: true
  explosions:
    # cancel-whole：波及需防護的領地時取消整次爆炸；disabled：不由 Land 攔截爆炸。
    # 範圍無法核實時取消整次爆炸，包含沒有 force 的區塊來源爆炸。
    # 這可能取消領地外的床／重生錨爆炸；若要完全停用 Land 爆炸攔截，設定 mode: disabled。
    # 只有 ownership.active 為 true 時才會攔截。
    mode: cancel-whole
    # 自然爆炸及無法確認玩家來源的 TNT，共用環境防護。
    environment-protection: true
    attribution-max-depth: 32
ownership:
  # 預設 false＝待命：只讀取與檢視資料，不攔截事件、不允許寫入指令。
  # 確認舊的領地管理者已停用後才改為 true，兩邊不可同時運作。
  active: false
storage:
  backend: SQLITE
  schema-version: 1
  directory: storage

display:
  player-land-topbar: true
  public-land-topbar: false

selection:
  enabled: true
  # 可用 Nukkit Item 名稱或 ID:damage；預設為木鋤（290）。
  tool: "290:0"
  # 沒有區域 provider 時，新選區是否預設忽略高度（平面領地）。
  default-ignore-height: false

facility:
  # 設施領地類型，可自行增加（小寫英文、數字、_ 或 -，最長 16 字）。
  # below／above：選取方塊往下、往上額外保護的格數；鐵路不擴張。
  types:
    road:
      below: 2
      above: 5
    rail:
      below: 0
      above: 0
    # 地鐵與出生點保護：不擴張，只保護選取的範圍。
    metro:
      below: 0
      above: 0
    spawn:
      below: 0
      above: 0

# 下級領地租賃：領地擁有者用 /land sub 切出下級領地，/land lease offer 出租，租金付給領地擁有者。
lease:
  currency: money # 租金的貨幣代碼
  period-days: 90 # 一期幾天（預設三個月）
  max-periods: 12 # 承租人一次最多預付幾期
  grace-days: 7 # 欠租後的寬限天數，寬限過了就收回
  allow-perpetual: false # 允許出租人設「沒有期限」的租約（週期天數 -1，只收一次租金）
  timezone: Asia/Taipei # 起訖日使用的時區
  auction: # 空置下級領地的拍賣：得標價就是第一期租金，其餘租約條件由出租人在拍賣時設定
    enabled: true # 是否開放拍賣
    min-hours: 1 # 拍賣最短幾小時
    max-hours: 168 # 拍賣最長幾小時（最多 168，即 7 天）
    anti-snipe-seconds: 120 # 結束前這麼多秒內有人出價，就把結束時間延到該筆出價後這麼多秒（0 為不延長）
    min-raise-percent: 5 # 每次最少加價，為起標價的百分比（無條件進位，至少 1）

pricing:
  # 購地基礎價格；優待與稅務不在此處，由區域／稅務 provider 提供倍率。
  currency: money
  # 立體領地每方塊單價。
  per-block: 6.3
  # 平面（忽略高度）領地每方塊單價，只計平面面積。
  per-block-flat: 73.1
  # 購地規則提供者（如 tokaRegions）消失後，先拒絕購買這麼多秒（它可能只是重載），之後改用上面的預設價格與規則；它重新註冊就立即接手。
  provider-lost-grace-seconds: 300
  # 刪除領地時退還基礎價格的比例，只退給建立者。
  refund-rate: 0.7
legacy:
  # tokaProfiles 接手舊名稱後，先等這麼多 tick（20 tick = 1 秒）把同時到來的接手合併，再用一次寫入一併換成帳號；範圍 1～1200。
  batch-delay-ticks: 40
